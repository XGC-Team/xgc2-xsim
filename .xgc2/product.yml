schema: xgc2.product.v1
id: xsim
name: xsim
version: 1.4.0-4
kind: ros1-apt
summary: Standalone ECS world with original FS150/Scout/Mecanum ROS interfaces and integrated CPU/GPU sensing.
ros:
  distro: noetic
  packages: []
apt:
  distribution: focal
  install: [xsim]
  packages: [xsim, libxgc2-sensing-gpu, libxgc2-sensing-dev]
  depends: [ros-noetic-roscpp, ros-noetic-mavros-msgs, ros-noetic-rosgraph-msgs, libxgc2-xrpc2 (>= 0.2.0-1~focal), libxgc2-chassis-hold1 (>= 0.2.0-1~focal), ros-noetic-xgc2-geometry-msgs (>= 1.5.0-4)]
usage:
  install: sudo apt install xsim
  smoke_test: /opt/xgc2/xsim/bin/xsim --help
  notes: >-
    Source Noetic before direct CLI use. Pass the verbatim flat frozen Session through
    --experiment-stdin with explicit --run-id, --socket and --target-id bindings;
    sceneAsset.sceneFile selects any external scene file. The native host owns its
    ServiceRef incarnation and samples its UTC epoch once at startup. Supervisor
    supplies the private runtime and ROS directories. --sensor-init-timeout-ms bounds
    native GPU initialization (default 10000 ms). Auto sensing attempts supported GPU
    observations and retains CPU execution when unavailable without changing the
    requested observation mode; explicit GPU failures are reported. The management
    socket also serves the xgc2.chassis.hold capability for Scout and Mecanum entities
    (POST /v1/call/xgc2.chassis.hold/<Method>). CPU sensing uses installed Math scene
    headers. The optional simulator-independent libxgc2-sensing-gpu package provides
    the shared renderer; libxgc2-sensing-dev provides the C ABI and loader headers.
    XGC2_SENSING_GPU_LIBRARY overrides the loader's installed shared-library path.
ownership:
  paths:
  - /opt/xgc2/xsim
  - /usr/share/xgc2/process-definitions/xsim-world.json
  - /usr/lib/xgc2-sensing
  - /usr/libexec/xgc2-sensing-probe
  - /usr/include/xgc2_sensing
  - /usr/share/xgc2-sensing
release:
  repository: XGC-Team/xgc2-xsim
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires: [libxgc2-math-dev, libxgc2-chassis-hold-dev, xgc2-xrpc, xgc2-ros-msgs]
  dependency_policy:
    xgc2-xrpc: rebuild
    libxgc2-math-dev: rebuild
    libxgc2-chassis-hold-dev: rebuild
    xgc2-ros-msgs: rebuild
  apt_versions:
    focal: 1.4.0-4
