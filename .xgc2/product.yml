schema: xgc2.product.v1
id: xsim
name: xsim
version: 1.3.0-1
kind: ros1-apt
summary: Standalone ECS world with original FS150/Scout/Mecanum ROS interfaces and integrated CPU/GPU sensing.
ros:
  distro: noetic
  packages: []
apt:
  distribution: focal
  install: [xsim]
  packages: [xsim, xsim-lidar-gpu]
  depends: [ros-noetic-roscpp, ros-noetic-mavros-msgs, ros-noetic-rosgraph-msgs, libxgc2-xrpc2 (>= 0.2.0-1~focal), libxgc2-chassis-hold1 (>= 0.2.0-1~focal)]
usage:
  install: sudo apt install xsim
  smoke_test: /opt/xgc2/xsim/bin/xsim --help
  notes: Source Noetic before direct CLI use. One frozen Experiment supplies the actual Session epoch; one explicit shared bootstrap supplies the private native RPC binding. GPU has no CPU fallback. The management socket also serves the xgc2.chassis.hold capability for the Scout and Mecanum entities (POST /v1/call/xgc2.chassis.hold/<Method>). CPU sensing uses installed Math 0.6.0 scene headers; the optional xsim-lidar-gpu package owns the GPL renderer and is loaded only for GPU sensors.
ownership:
  paths:
  - /opt/xgc2/xsim
  - /usr/share/xgc2/process-definitions/xsim-world.json
release:
  repository: XGC-Team/xgc2-xsim
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires: [libxgc2-math-dev, libxgc2-chassis-hold-dev, xgc2-xrpc]
  dependency_policy:
    xgc2-xrpc: rebuild
    libxgc2-math-dev: verify
    libxgc2-chassis-hold-dev: rebuild
  apt_versions:
    focal: 1.3.0-1
