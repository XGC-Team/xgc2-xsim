schema: xgc2.product.v1
id: xsim
name: xsim
version: 1.1.0-3
kind: ros1-apt
summary: Standalone ECS world with original FS150/Scout/Mecanum ROS interfaces and integrated CPU/GPU sensing.
ros:
  distro: noetic
  packages: []
apt:
  distribution: focal
  install: [xsim]
  packages: [xsim]
  depends: [ros-noetic-roscpp, ros-noetic-mavros-msgs, ros-noetic-rosgraph-msgs, libglfw3, libxgc2-xrpc1]
usage:
  install: sudo apt install xsim
  smoke_test: /opt/xgc2/xsim/bin/xsim --help
  notes: Source Noetic before direct CLI use. One frozen Experiment supplies the actual Session epoch; one explicit shared bootstrap supplies the private native RPC binding. GPU has no CPU fallback. The sensor implementation is built from the explicit ros1/common/scene checkout, never copied into this owner.
ownership:
  paths:
  - /opt/xgc2/xsim
release:
  repository: XGC-Team/xgc2-xsim
  ref: main
  workflow: release.yml
  ci_workflow: ci.yml
  requires: [libxgc2-math-dev, xgc2-xrpc]
  dependency_policy:
    xgc2-xrpc: rebuild
    libxgc2-math-dev: verify
  apt_versions:
    focal: 1.1.0-3
